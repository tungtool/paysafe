<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafePay – Giao dịch trung gian an toàn</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
  <div class="logo" onclick="Router.go('home')"><span class="logo-icon">🛡️</span> SafePay</div>
  <div class="actions" id="nav-actions"></div>
</nav>

<!-- HOME -->
<div class="page" id="page-home">
  <div class="card" style="max-width:480px;margin:0 auto 20px;">
    <div id="auth-box"></div>
  </div>

  <div class="card" style="max-width:480px;margin:0 auto;" id="room-box">
    <div class="tab-row">
      <div class="tab active" data-tab="create" onclick="UI.switchTab('create')">Tạo phòng mới</div>
      <div class="tab" data-tab="join" onclick="UI.switchTab('join')">Tham gia phòng</div>
    </div>

    <div id="tab-create">
      <div class="role-select">
        <div class="role-card active" data-role="buyer" onclick="UI.selectRole('buyer')">🛒<br><b>Người mua</b></div>
        <div class="role-card" data-role="seller" onclick="UI.selectRole('seller')">📦<br><b>Người bán</b></div>
      </div>
      <div class="form-group"><label>Tiêu đề giao dịch</label><input id="f-title" placeholder="VD: Tài khoản Facebook 10k follow"></div>
      <div class="form-group"><label>Mô tả chi tiết</label><textarea id="f-desc" rows="2" placeholder="Mô tả sản phẩm / dịch vụ"></textarea></div>
      <div class="grid-2">
        <div class="form-group"><label>Số tiền (VNĐ)</label><input id="f-amount" type="number" placeholder="500000"></div>
        <div class="form-group"><label>Thời hạn kiểm tra (giờ)</label><input id="f-hours" type="number" value="24"></div>
      </div>
      <p class="hint" id="fee-hint" style="color:var(--text-muted);font-size:12px;margin-bottom:14px;"></p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="UI.createRoom()">Tạo phòng giao dịch</button>
    </div>

    <div id="tab-join" class="hidden">
      <div class="form-group"><label>Mã phòng</label><input id="f-code" placeholder="SP-XXXXXX" style="text-transform:uppercase;"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="UI.joinRoom()">Tham gia phòng</button>
    </div>
  </div>

  <div class="card" style="max-width:480px;margin:20px auto 0;" id="my-rooms-box"></div>
</div>

<!-- ROOM -->
<div class="page" id="page-room">
  <div class="room-layout">
    <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div><span id="room-badge" class="badge"></span></div>
          <div style="font-size:13px;color:var(--text-muted);">Mã phòng: <span class="copy-code" id="room-code-display" onclick="UI.copyRoomCode()"></span></div>
        </div>
        <h2 id="room-title"></h2>
        <div id="room-info-rows"></div>
      </div>

      <div class="card">
        <h3>💬 Hộp thư phòng giao dịch</h3>
        <div class="chat-box" id="chat-box"></div>
        <div class="chat-input-row">
          <input id="chat-input" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter')UI.sendChat()">
          <button class="btn btn-primary btn-sm" onclick="UI.sendChat()">Gửi</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card" id="action-panel"></div>
      <div class="card">
        <h3>📜 Nhật ký & giao dịch tiền</h3>
        <div id="tx-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div class="page" id="page-admin">
  <h1>🛠️ Bảng điều khiển Admin</h1>
  <p class="sub">Xác nhận giải ngân thật & xử lý tranh chấp</p>
  <div class="card"><h2>Tổng quan</h2><div id="admin-stats"></div></div>
  <div class="card"><h2>💸 Chờ giải ngân / hoàn tiền</h2><div id="admin-payouts"></div></div>
  <div class="card"><h2>⚖️ Tranh chấp</h2><div id="admin-disputes"></div></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
